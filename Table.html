<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLES</title>
</head>
<body>
    <h2> HTML TABLE TAG EXAMPLE</h2>

    <table border="3">
        <caption> Student Marks Details </caption>
        <colgroup>
            <col style="background-color:lavenderblush;">
            <col style="background-color:lavender;">
            <col style="background-color:lavender;">


        </colgroup>
        <thead>
        <tr style="background-color: rgb(124, 87, 158);">
            <th>Student Name</th>
            <th>Subject</th>
            <th> Marks</th>
        </tr>
        </thead>

        <tbody>

        <tr>
            <td rowspan="2" style="padding: 20px;">Ravi</td>
            <td> HTML</td>
            <td> 89</td>
        </tr>
        <tr>
           
            <td> CSS</td>
            <td> 99</td>

        </tr>
        <tr>
            <td rowspan="2" style="padding: 20px;"> Afreen</td>
            <td> HTML</td>
            <td> 90</td>

        </tr>
        <tr>
            
            <td> CSS</td>
            <td> 98</td>

        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="2" style ="text-align:center;"> Total students</th>
           
            <td> 2 </td>

        </tr>
</tfoot>
    </table>
        
</body>
</html>
